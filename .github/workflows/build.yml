# Builds ready-to-run PDF Cutter apps for Windows, macOS and Linux.
# Every push to the default branch publishes them as a new GitHub Release,
# so you can download the app from the "Releases" section of the repo page.

name: Build app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: pip install -r requirements.txt pytest
      - run: xvfb-run -a pytest -q  # the GUI tests need a (virtual) display

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PDF-Cutter-Windows.exe
          - os: macos-latest
            asset: PDF-Cutter-macOS.zip
          - os: ubuntu-latest
            asset: PDF-Cutter-Linux
    runs-on: ${{ matrix.os }}
    env:
      PDFCUTTER_REQUIRE_DND: "1" # the self-test fails if drag and drop didn't make it into the app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - run: pyinstaller --noconfirm pdf-cutter.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist\PDF-Cutter.exe ${{ matrix.asset }}
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath .\${{ matrix.asset }} -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test failed with exit code $($p.ExitCode)"; exit 1 }

      - name: Self-test and package (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          "dist/PDF Cutter.app/Contents/MacOS/PDF Cutter" --self-test
          ditto -c -k --sequesterRsrc --keepParent "dist/PDF Cutter.app" ${{ matrix.asset }}

      - name: Self-test and package (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          mv dist/PDF-Cutter ${{ matrix.asset }}
          xvfb-run -a ./${{ matrix.asset }} --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: PDF Cutter 2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: assets/*
          body: |
            Download the file for your computer below (under **Assets**):

            - **Windows:** `PDF-Cutter-Windows.exe`. Double-click it. If Windows shows "Windows protected your PC", click **More info → Run anyway**.
            - **Mac (Apple Silicon, M1 or newer):** `PDF-Cutter-macOS.zip`. Unzip it and move **PDF Cutter** to Applications. The first time, macOS will block it: open **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Linux:** `PDF-Cutter-Linux`. Run `chmod +x PDF-Cutter-Linux` once, then start it.
